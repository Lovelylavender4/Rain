<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07090b" />
    <meta
      name="description"
      content="通用系统总线。闪烁的投影、游移的扫描线、零重力神经束；一个没有房间背景的动态场景。"
    />
    <title>通用系统总线 · General Systems Bus</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='none' stroke='%23d4dc9a'%3E%3Ccircle cx='16' cy='16' r='12'/%3E%3Ccircle cx='16' cy='16' r='5'/%3E%3Cpath d='M16 0v11m0 10v11M0 16h11m10 0h11'/%3E%3C/g%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./general-systems-bus/scene.css" />
    <script src="./general-systems-bus/original-data.js" defer></script>
    <script src="./general-systems-bus/original-shaders.js" defer></script>
    <script src="./general-systems-bus/original-engine.js" defer></script>
    <script src="./general-systems-bus/scene.js" defer></script>
  </head>
  <body class="ui-hidden">
    <main class="observatory" id="observatory" tabindex="-1" aria-label="通用系统总线动态场景">
      <canvas
        id="bus-canvas"
        aria-label="无背景特效：闪烁字形、扫描线、相连的圆环、红色神经束与漂浮神经元"
        role="img"
      ></canvas>

      <header class="scene-header chrome">
        <div class="scene-identity">
          <div class="eyebrow">
            <span class="identity-mark" aria-hidden="true">⨀</span>
            RAIN WORLD
            <span class="divider">/</span>
            FIVE PEBBLES
          </div>
          <h1>通用系统总线</h1>
          <p class="english-title">GENERAL SYSTEMS BUS</p>
        </div>
        <div class="header-actions">
          <button
            class="icon-button"
            id="sound-button"
            aria-label="开启声音"
            aria-pressed="false"
            title="声音 · M"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m11 5-6 5H2v4h3l6 5z" />
              <path class="sound-waves" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14" />
              <path class="sound-muted" d="m16 9 5 6m0-6-5 6" />
            </svg>
          </button>
          <button class="icon-button" id="fullscreen-button" aria-label="进入全屏" title="全屏 · F">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5" />
            </svg>
          </button>
          <button
            class="icon-button"
            id="settings-button"
            aria-label="打开特效设置"
            aria-controls="settings-panel"
            aria-expanded="false"
            title="特效设置"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h16M4 17h16" />
              <circle cx="8" cy="7" r="3" />
              <circle cx="16" cy="17" r="3" />
            </svg>
          </button>
        </div>
      </header>

      <div class="side-note chrome" aria-hidden="true">
        <span>SS</span>
        <span class="side-rule"></span>
        <span>GENERAL SYSTEMS BUS</span>
      </div>

      <aside class="settings-panel chrome" id="settings-panel" aria-label="特效设置" hidden>
        <div class="panel-heading">
          <div>
            <span class="eyebrow">PROJECTION CONTROL</span>
            <h2>投影控制</h2>
          </div>
          <button class="icon-button" id="close-settings" aria-label="关闭特效设置">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6" /></svg>
          </button>
        </div>
        <div class="slider-field">
          <label for="scale">
            显示比例
            <output id="scale-value" for="scale">100%</output>
          </label>
          <input id="scale" type="range" min="80" max="160" step="5" value="100" />
        </div>
        <div class="slider-field">
          <label for="density">
            投影密度
            <output id="density-value" for="density">100%</output>
          </label>
          <input id="density" type="range" min="15" max="100" value="100" />
        </div>
        <div class="slider-field">
          <label for="neuron-count">
            神经元数量
            <output id="neuron-count-value" for="neuron-count">50 个</output>
          </label>
          <input id="neuron-count" type="range" min="0" max="200" step="1" value="50" />
        </div>
        <div class="slider-field">
          <label for="speed">
            时间流速
            <output id="speed-value" for="speed">1.0×</output>
          </label>
          <input id="speed" type="range" min="20" max="180" value="100" />
        </div>
        <section class="palette-controls" aria-labelledby="palette-heading">
          <div class="palette-heading">
            <h3 id="palette-heading">投影配色</h3>
            <button id="reset-colors" class="text-button subtle">重置配色</button>
          </div>
          <div class="probability-controls">
            <div class="slider-field">
              <label for="red-probability">
                红色概率
                <output id="red-probability-value" for="red-probability">3%</output>
              </label>
              <input id="red-probability" type="range" min="0" max="100" step="1" value="3" />
            </div>
            <div class="slider-field">
              <label for="blue-probability">
                蓝色概率
                <output id="blue-probability-value" for="blue-probability">3%</output>
              </label>
              <input id="blue-probability" type="range" min="0" max="100" step="1" value="3" />
            </div>
            <div class="slider-field">
              <label for="yellow-probability">
                黄色概率
                <output id="yellow-probability-value" for="yellow-probability">0%</output>
              </label>
              <input id="yellow-probability" type="range" min="0" max="100" step="1" value="0" />
            </div>
            <div class="slider-field">
              <label for="green-probability">
                绿色概率
                <output id="green-probability-value" for="green-probability">0%</output>
              </label>
              <input id="green-probability" type="range" min="0" max="100" step="1" value="0" />
            </div>
            <div class="slider-field">
              <label for="white-probability">
                白色概率
                <output id="white-probability-value" for="white-probability">0%</output>
              </label>
              <input id="white-probability" type="range" min="0" max="100" step="1" value="0" />
            </div>
            <p class="probability-note">
              其余为青绿：
              <output id="teal-probability-value">94%</output>
              · 所有颜色合计 100%
            </p>
          </div>
          <div class="color-select-field">
            <label for="color-select">调整颜色</label>
            <select id="color-select">
              <option value="teal">默认青绿</option>
              <option value="red">红色</option>
              <option value="blue">蓝色</option>
              <option value="yellow">黄色</option>
              <option value="green">绿色</option>
              <option value="white">白色</option>
            </select>
          </div>
          <div class="color-preview" role="group" aria-label="颜色预览">
            <div class="color-preview-comparison">
              <div>
                <span>原色</span>
                <div id="color-preview-original" class="color-preview-chip" aria-hidden="true"></div>
                <output id="color-preview-original-value"></output>
              </div>
              <div>
                <span>调整后</span>
                <div id="color-preview-adjusted" class="color-preview-chip" aria-hidden="true"></div>
                <output id="color-preview-adjusted-value"></output>
              </div>
            </div>
            <svg class="color-preview-effects" viewBox="0 0 236 36" aria-hidden="true">
              <path id="color-preview-glyphs" fill="currentColor" />
              <path d="M84 18h70m32 0h38" fill="none" stroke="currentColor" stroke-width="2" />
              <circle cx="170" cy="18" r="16" fill="none" stroke="currentColor" stroke-width="3" />
            </svg>
          </div>
          <div class="slider-field">
            <label for="color-saturation">
              饱和度
              <output id="color-saturation-value" for="color-saturation">100%</output>
            </label>
            <input id="color-saturation" type="range" min="0" max="200" step="1" value="100" />
          </div>
          <div class="slider-field">
            <label for="color-grayscale">
              灰度
              <output id="color-grayscale-value" for="color-grayscale">0%</output>
            </label>
            <input id="color-grayscale" type="range" min="0" max="100" step="1" value="0" />
          </div>
          <div class="slider-field">
            <label for="color-brightness">
              亮度
              <output id="color-brightness-value" for="color-brightness">100%</output>
            </label>
            <input id="color-brightness" type="range" min="0" max="200" step="1" value="100" />
          </div>
        </section>
        <fieldset class="layers">
          <legend>
            特效图层
            <span>LAYERS</span>
          </legend>
          <label>
            <span>
              <i class="layer-dot glyph-dot"></i>
              符号矩阵
            </span>
            <input type="checkbox" data-layer="glyphs" checked />
            <span class="switch" aria-hidden="true"></span>
          </label>
          <label>
            <span>
              <i class="layer-dot scan-dot"></i>
              扫描线与游标
            </span>
            <input type="checkbox" data-layer="scans" checked />
            <span class="switch" aria-hidden="true"></span>
          </label>
          <label>
            <span>
              <i class="layer-dot circle-dot"></i>
              关联圆环
            </span>
            <input type="checkbox" data-layer="circles" checked />
            <span class="switch" aria-hidden="true"></span>
          </label>
          <label>
            <span>
              <i class="layer-dot coral-dot"></i>
              红色神经束
            </span>
            <input type="checkbox" data-layer="tendrils" checked />
            <span class="switch" aria-hidden="true"></span>
          </label>
          <label>
            <span>
              <i class="layer-dot mycelia-dot"></i>
              悬浮菌丝
            </span>
            <input type="checkbox" data-layer="mycelia" checked />
            <span class="switch" aria-hidden="true"></span>
          </label>
          <label>
            <span>
              <i class="layer-dot neuron-dot"></i>
              神经元群
            </span>
            <input type="checkbox" data-layer="neurons" checked />
            <span class="switch" aria-hidden="true"></span>
          </label>
          <label>
            <span>
              <i class="layer-dot fuse-dot"></i>
              电路闪光
            </span>
            <input type="checkbox" data-layer="fuses" checked />
            <span class="switch" aria-hidden="true"></span>
          </label>
          <label>
            <span>
              <i class="layer-dot dust-dot"></i>
              零重力微粒
            </span>
            <input type="checkbox" data-layer="dust" checked />
            <span class="switch" aria-hidden="true"></span>
          </label>
        </fieldset>
        <div class="backdrop-field">
          <label for="backdrop">预览底色</label>
          <select id="backdrop">
            <option value="dark">深黑</option>
            <option value="light">浅灰</option>
            <option value="transparent">透明</option>
          </select>
        </div>
        <p class="panel-note">画布始终透明。底色仅供预览，导出只包含特效。</p>
        <div class="panel-actions">
          <button id="export-button" class="text-button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5" />
            </svg>
            导出透明 PNG
          </button>
          <button id="reset-button" class="text-button subtle">重置</button>
        </div>
        <p class="shortcut-note">
          <kbd>空格</kbd>
          暂停
          <kbd>H</kbd>
          隐藏界面
          <kbd>R</kbd>
          重排
        </p>
      </aside>

      <footer class="scene-footer chrome">
        <div class="playback-actions">
          <button
            class="icon-button"
            id="pause-button"
            aria-label="暂停动画"
            aria-pressed="false"
            title="暂停 / 继续 · 空格"
          >
            <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5v14M16 5v14" /></svg
            ><svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m8 5 11 7-11 7z" />
            </svg>
          </button>
          <button class="icon-button" id="hide-button" aria-label="隐藏界面" title="沉浸模式 · H">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
          <span class="playback-label" id="playback-state">LIVE</span>
        </div>
      </footer>
      <p class="copyright-note">参考游戏《雨世界》中的特效编写，版权归属《雨世界》官方</p>
      <button class="restore-button" id="restore-button" aria-label="显示界面" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9V4h5m6 0h5v5M4 15v5h5m11-5v5h-5" />
        </svg>
        <span>显示界面</span>
      </button>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <noscript><p class="fallback">请启用 JavaScript 以观看通用系统总线的动态投影。</p></noscript>
    </main>
  </body>
</html>
